<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe AI with Difficulty & Fun Modes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <div id="menu-screen" class="container">
            <h1>Tic-Tac-Toe AI with Fun Modes</h1>
            <p>Choose your Game Mode:</p>
            <div class="menu-buttons">
                <button id="pvp-button" class="menu-button">Player Vs. Player</button>
                <button id="pva-button" class="menu-button">Player Vs. AI</button>
                <button id="fun-modes-button" class="menu-button">Fun Modes</button>
            </div>
        </div>

        <div id="difficulty-screen" class="container hidden">
            <h1>Select AI Difficulty</h1>
            <div class="menu-buttons">
                <button id="easy-button" class="menu-button difficulty-btn" data-difficulty="easy">Easy</button>
                <button id="medium-button" class="menu-button difficulty-btn" data-difficulty="medium">Medium</button>
                <button id="hard-button" class="menu-button difficulty-btn" data-difficulty="hard">Hard</button>
                <button id="unbeatable-button" class="menu-button difficulty-btn" data-difficulty="unbeatable">⚔️UNBEATABLE⚔️</button>
            </div>
            <button id="difficulty-back-button">Back to Menu</button>
        </div>

        <div id="grid-screen" class="container hidden">
            <h1>Select Grid Size</h1>
            <p>(Player vs. Player only)</p>
            <div class="menu-buttons grid-options">
            </div>
            <button id="grid-back-button">Back to Menu</button>
        </div>

        <div id="fun-modes-screen" class="container hidden">
            <h1>Select a Fun Mode</h1>
            <p>(Coming Soon!)</p>
            <div class="menu-buttons">
                <button id="cheater-button" class="menu-button">Cheater Mode</button>
                <button id="blind-button" class="menu-button">Blind Mode</button>
                <button id="clock-button" class="menu-button">Clock Mode</button>
                <button id="unfair-button" class="menu-button">Unfair Mode</button>
                <button id="decay-button" class="menu-button">Decay Mode</button>
                <button id="portal-button" class="menu-button">Portal Mode</button>
                <button id="sabotage-button" class="menu-button">Sabotage Mode</button>
            </div>
            <button id="fun-modes-back-button">Back to Menu</button>
        </div>
        
        <div id="game-screen" class="container hidden">
            <div id="scoreboard">
                <div id="score-x" class="score">Player X: 0</div>
                <div class="status-container">
                    <div id="score-tie" class="score">Ties: 0</div>
                    <div id="status-text"></div>
                </div>
                <div id="score-o" class="score">Player O: 0</div>
            </div>
            <div id="game-board"></div>
            <button id="game-back-button">Back</button>
        </div>
    </main>

    <div class="team-credit">
        <span>Tic-Tac-Toe using AI Algorithms: Minimax algorithm with Alpha-Beta Pruning</span>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const SOUNDS = {
            click: new Audio('sounds/click.wav'),
            win: new Audio('sounds/win.wav'),
            draw: new Audio('sounds/draw.wav'),
            ui: new Audio('sounds/ui-click.wav')
        };

        function playSound(sound) {
            const audio = SOUNDS[sound];
            if (audio) {
                audio.cloneNode().play().catch(() => {});
            }
        }

        // UI & Navigation tracking only (no game rules/state/score counters)
        let selectedMode = 'pvp';
        let selectedDifficulty = null;
        let selectedGridSize = 3;
        let selectedWinLength = 3;
        let previousScreen = null;
        let latestServerState = null;
        let isRequestPending = false;
        let sessionToken = sessionStorage.getItem('tic-tac-toe-session-token');

        const menuScreen = document.getElementById('menu-screen'),
            difficultyScreen = document.getElementById('difficulty-screen'),
            gridScreen = document.getElementById('grid-screen'),
            gameScreen = document.getElementById('game-screen'),
            funModesScreen = document.getElementById('fun-modes-screen');
        const statusText = document.getElementById('status-text'),
            gameBoard = document.getElementById('game-board');
        const pvpButton = document.getElementById('pvp-button'),
            pvaButton = document.getElementById('pva-button'),
            funModesButton = document.getElementById('fun-modes-button');
        const gameBackButton = document.getElementById('game-back-button'),
            difficultyBackButton = document.getElementById('difficulty-back-button'),
            gridBackButton = document.getElementById('grid-back-button'),
            funModesBackButton = document.getElementById('fun-modes-back-button');
        const teamCredit = document.querySelector('.team-credit'),
            scoreXElement = document.getElementById('score-x'),
            scoreOElement = document.getElementById('score-o'),
            scoreTieElement = document.getElementById('score-tie');

        // Screen Navigation
        pvpButton.addEventListener('click', () => { playSound('ui'); showGridScreen(); });
        pvaButton.addEventListener('click', () => { playSound('ui'); showDifficultyScreen(); });
        funModesButton.addEventListener('click', () => { playSound('ui'); showFunModesScreen(); });
        document.querySelectorAll('#difficulty-screen .difficulty-btn').forEach(button => {
            button.addEventListener('click', e => {
                playSound('ui');
                selectMode('pva', e.target.dataset.difficulty);
            });
        });
        document.querySelectorAll('#fun-modes-screen .menu-button').forEach(button => {
            button.addEventListener('click', () => { playSound('ui'); alert('This Fun Mode is coming soon!'); });
        });
        gameBackButton.addEventListener('click', () => { playSound('ui'); goBack(); });
        difficultyBackButton.addEventListener('click', () => { playSound('ui'); showMenu(); });
        gridBackButton.addEventListener('click', () => { playSound('ui'); showMenu(); });
        funModesBackButton.addEventListener('click', () => { playSound('ui'); showMenu(); });

        function showMenu() {
            gameScreen.classList.add('hidden');
            difficultyScreen.classList.add('hidden');
            gridScreen.classList.add('hidden');
            funModesScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            if (teamCredit) teamCredit.classList.remove('hidden');
            document.body.className = 'x-turn';
        }

        function goBack() {
            gameScreen.classList.add('hidden');
            if (previousScreen === 'difficulty') showDifficultyScreen();
            else if (previousScreen === 'grid') showGridScreen();
            else showMenu();
        }

        function showDifficultyScreen() {
            menuScreen.classList.add('hidden');
            difficultyScreen.classList.remove('hidden');
            if (teamCredit) teamCredit.classList.add('hidden');
            previousScreen = 'difficulty';
        }

        function showGridScreen() {
            menuScreen.classList.add('hidden');
            gridScreen.classList.remove('hidden');
            if (teamCredit) teamCredit.classList.add('hidden');
            populateGridOptions();
            previousScreen = 'grid';
        }

        function showFunModesScreen() {
            menuScreen.classList.add('hidden');
            funModesScreen.classList.remove('hidden');
            if (teamCredit) teamCredit.classList.add('hidden');
            previousScreen = 'fun-modes';
        }

        function selectMode(mode, diff = null, size = 3, length = 3) {
            selectedMode = mode;
            selectedDifficulty = diff;
            selectedGridSize = size;
            selectedWinLength = length;

            menuScreen.classList.add('hidden');
            difficultyScreen.classList.add('hidden');
            gridScreen.classList.add('hidden');
            funModesScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            if (teamCredit) teamCredit.classList.add('hidden');

            const shouldResetScores = (mode === 'pvp' && previousScreen !== 'grid') ||
                                      (mode === 'pva' && previousScreen !== 'difficulty');

            sendAction({
                action: 'start',
                mode: selectedMode,
                difficulty: selectedDifficulty,
                size: selectedGridSize,
                length: selectedWinLength,
                reset_scores: shouldResetScores
            });
        }

        function populateGridOptions() {
            const gridOptionsContainer = document.querySelector('#grid-screen .menu-buttons');
            gridOptionsContainer.innerHTML = '';
            const options = [
                { size: 2, length: 2 }, { size: 3, length: 3 }, { size: 4, length: 3 },
                { size: 5, length: 4 }, { size: 6, length: 5 }, { size: 7, length: 5 },
                { size: 8, length: 6 }, { size: 9, length: 6 }
            ];
            options.forEach(opt => {
                const button = document.createElement('button');
                button.classList.add('menu-button', 'grid-option-btn');
                button.textContent = `${opt.size}x${opt.size} (${opt.length}-in-a-row)`;
                button.onclick = () => {
                    playSound('ui');
                    selectMode('pvp', null, opt.size, opt.length);
                };
                gridOptionsContainer.appendChild(button);
            });
        }

        // Game Screen click capturing
        gameScreen.addEventListener('click', (e) => {
            if (isRequestPending) return;

            if (latestServerState && !latestServerState.game_active) {
                playSound('ui');
                sendAction({ action: 'restart' });
            } else if (e.target.classList.contains('cell')) {
                const cellIndex = parseInt(e.target.dataset.index, 10);
                sendAction({ action: 'click', index: cellIndex });
            }
        });

        // Thin view dispatcher: Send action to Python, render returned JSON
        async function sendAction(payload) {
            isRequestPending = true;
            try {
                const requestPayload = { ...payload };
                if (sessionToken) requestPayload.session_token = sessionToken;
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestPayload)
                });
                const state = await response.json();
                if (!response.ok) throw new Error(state.error || 'The game request failed.');
                if (state.session_token) {
                    sessionToken = state.session_token;
                    sessionStorage.setItem('tic-tac-toe-session-token', sessionToken);
                }
                latestServerState = state;
                renderState(state);
                if (state.sound) {
                    playSound(state.sound);
                }
            } catch (err) {
                console.error("Action error:", err);
            } finally {
                isRequestPending = false;
            }
        }

        // Pure View Renderer driven strictly by server response
        function renderState(state) {
            const board = state.board || [];
            const size = state.grid_size || Math.round(Math.sqrt(board.length)) || 3;

            // Recreate cell elements if board dimensions changed
            if (gameBoard.children.length !== board.length) {
                gameBoard.innerHTML = '';
                const boardSizePx = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.7, 600);
                const cellSize = boardSizePx / size;
                const fontSize = cellSize * 0.6;

                gameBoard.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
                gameBoard.style.gridTemplateRows = `repeat(${size}, 1fr)`;
                gameBoard.style.width = `${boardSizePx}px`;
                gameBoard.style.height = `${boardSizePx}px`;

                for (let i = 0; i < board.length; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.index = i;
                    cell.style.fontSize = `${fontSize}px`;
                    gameBoard.appendChild(cell);
                }
            }

            // Sync cell contents and classes with Python board state
            for (let i = 0; i < board.length; i++) {
                const cell = gameBoard.children[i];
                if (!cell) continue;
                const val = board[i];
                if (val) {
                    cell.textContent = val;
                    cell.className = `cell ${val.toLowerCase()}`;
                } else {
                    cell.textContent = '';
                    cell.className = 'cell';
                }
            }

            // Status message and game over animation
            statusText.textContent = state.status_text || '';
            if (!state.game_active) {
                statusText.classList.add('status-pop-out');
                if (state.winner === 'X') {
                    statusText.style.color = 'var(--player-x-color)';
                } else if (state.winner === 'O') {
                    statusText.style.color = 'var(--player-o-color)';
                } else {
                    statusText.style.color = '';
                }
            } else {
                statusText.classList.remove('status-pop-out');
                statusText.style.color = '';
            }

            // Body turn gradient class
            document.body.className = state.current_player === 'X' ? 'x-turn' : 'o-turn';

            // Scoreboard values from Python engine
            if (state.game_mode === 'pvp') {
                scoreXElement.textContent = `Player X: ${state.pvp_score_x}`;
                scoreOElement.textContent = `Player O: ${state.pvp_score_o}`;
                scoreTieElement.textContent = `Ties: ${state.pvp_ties}`;
            } else {
                scoreXElement.textContent = `You (X): ${state.pva_score_x}`;
                scoreOElement.textContent = `AI (O): ${state.pva_score_o}`;
                scoreTieElement.textContent = `Ties: ${state.pva_ties}`;
            }

            // Active player glow
            scoreXElement.classList.toggle('active-player', state.game_active && state.current_player === 'X');
            scoreOElement.classList.toggle('active-player', state.game_active && state.current_player === 'O');
        }
    });
    </script>
</body>
</html>
